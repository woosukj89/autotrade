name: Manual Session Refresh (Telegram-triggered)

# Fired by a repository_dispatch event of type "manual-session-refresh",
# sent by scripts/telegram_listener.py when the user replies /refresh
# (optionally with a manual MFA/SMS code) to the Telegram bot. This is
# the "one-tap re-trigger" half of the re-authentication assistant -
# see scripts/refresh_session.py and scripts/telegram_listener.py for
# the full design rationale.

on:
  repository_dispatch:
    types: [manual-session-refresh]

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Robinhood session
        env:
          ROBINHOOD_SESSION: ${{ secrets.ROBINHOOD_SESSION }}
        run: |
          if [ -n "$ROBINHOOD_SESSION" ]; then
            mkdir -p .session
            echo "$ROBINHOOD_SESSION" | base64 -d > .session/robinhood.pickle
            echo "Session pickle restored."
          else
            echo "No existing session pickle - will attempt a fresh login."
          fi

      - name: Refresh session (with relayed MFA code if provided)
        env:
          ROBINHOOD_USERNAME: ${{ secrets.ROBINHOOD_USERNAME }}
          ROBINHOOD_PASSWORD: ${{ secrets.ROBINHOOD_PASSWORD }}
          ROBINHOOD_PICKLE_PATH: .session
          ROBINHOOD_MFA_CODE: ${{ github.event.client_payload.mfa_code }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/refresh_session.py

      - name: Save refreshed session to secret
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f .session/robinhood.pickle ]; then
            NEW_SESSION=$(base64 -w 0 .session/robinhood.pickle)
            gh secret set ROBINHOOD_SESSION --body "$NEW_SESSION"
            echo "ROBINHOOD_SESSION secret updated."
          else
            echo "WARNING: No pickle file found - secret not updated."
          fi
