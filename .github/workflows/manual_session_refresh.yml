name: Manual Session Refresh

# Two ways to fire this:
#  1. repository_dispatch (type "manual-session-refresh") - sent by the
#     "Retry Now" action button on the ntfy.sh push notification that
#     scripts/refresh_session.py sends on a refresh failure. Genuinely
#     one-tap: the button fires the HTTP request straight from the
#     phone's notification shade, no app to open.
#  2. workflow_dispatch - manual fallback via the GitHub Actions UI or
#     the GitHub Mobile app, with an optional mfa_code input, for cases
#     where a typed code is needed (the ntfy button can't collect free
#     text) or the push notification itself didn't arrive.
#
# This is the "one-tap re-trigger" half of the re-authentication
# assistant - see scripts/refresh_session.py for the full design
# rationale (originally built around a Telegram bot, replaced after
# Telegram's SMS verification proved unreliable for a Korean number).

on:
  repository_dispatch:
    types: [manual-session-refresh]
  workflow_dispatch:
    inputs:
      mfa_code:
        description: 'Manual MFA/SMS code (leave blank to use TOTP auto-generation)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Robinhood session
        env:
          ROBINHOOD_SESSION: ${{ secrets.ROBINHOOD_SESSION }}
        run: |
          if [ -n "$ROBINHOOD_SESSION" ]; then
            mkdir -p .session
            echo "$ROBINHOOD_SESSION" | base64 -d > .session/robinhood.pickle
            echo "Session pickle restored."
          else
            echo "No existing session pickle - will attempt a fresh login."
          fi

      - name: Refresh session (with relayed MFA code if provided)
        env:
          ROBINHOOD_USERNAME: ${{ secrets.ROBINHOOD_USERNAME }}
          ROBINHOOD_PASSWORD: ${{ secrets.ROBINHOOD_PASSWORD }}
          ROBINHOOD_PICKLE_PATH: .session
          ROBINHOOD_MFA_CODE: ${{ github.event.client_payload.mfa_code || github.event.inputs.mfa_code }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_ACTION_PAT: ${{ secrets.NTFY_ACTION_PAT }}
        run: python scripts/refresh_session.py

      - name: Save refreshed session to secret
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f .session/robinhood.pickle ]; then
            NEW_SESSION=$(base64 -w 0 .session/robinhood.pickle)
            gh secret set ROBINHOOD_SESSION --body "$NEW_SESSION"
            echo "ROBINHOOD_SESSION secret updated."
          else
            echo "WARNING: No pickle file found - secret not updated."
          fi
